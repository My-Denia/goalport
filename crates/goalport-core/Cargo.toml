[package]
name = "goalport-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "goalport-core"
path = "src/main.rs"

# Transient Claude-only stop broker. A child process of Core, never a service.
[[bin]]
name = "goalport-claude-stop-broker"
path = "src/bin/goalport-claude-stop-broker.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["fileapi", "handleapi", "namedpipeapi", "winbase", "winnt", "errhandlingapi", "winerror", "accctrl", "aclapi", "minwinbase", "processthreadsapi", "sddl", "securitybaseapi"] }
