[package]
name = "goalport-core-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Lifecycle-independent GoalPort Core launcher"

[[bin]]
name = "goalport-core-launcher"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["handleapi", "jobapi", "jobapi2", "processthreadsapi", "synchapi", "winbase", "winerror", "winnt"] }
