# Windows code contracts and repository-built Electron RC smoke.
# Synthetic Desktop checks do not establish native subscription admission.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:unit
      - run: node --test scripts/runtime-live-safety.test.mjs scripts/scenario-predicate-gate.test.mjs scripts/connected/strict-predicates.test.mjs scripts/connected/ipc-client.test.mjs

  core:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-12); toolchain pinned via `with:` below
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Core contract tests
        shell: pwsh
        run: |
          Get-ChildItem Env: |
            Where-Object { $_.Name -like 'GOALPORT_*' } |
            ForEach-Object { Remove-Item "Env:$($_.Name)" }
          cargo test -p goalport-core --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p goalport-core --test workspace_aliases --test workspace_identity --test electron_rc_core --test handoff_lineage --test product_receipts --test scenario_turn_failure --test selection_preservation --test registration_boundary --test core_contract --test connected_projection --test connected_flow --test scenario_predicates --test state_machine --test hardening --test recovery --test stop_responsibility --test stop_continuation --test pipe_security --test core_restart_epoch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($case in @('r1_succeeded_send_replays_as_duplicate_success_without_delivery', 'r1b_succeeded_send_still_replays_as_success_after_the_attempt_became_terminal', 'r10_repeated_handoff_is_refused_before_its_derived_send_and_delivers_nothing', 'n1_reuse_for_another_task_is_refused_and_the_selection_is_kept')) {
            cargo test --locked -p goalport-core --test registration_generation $case -- --exact
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          cargo test --locked -p goalport-core-launcher -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Placeholder Core binaries for Tauri resource check
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/release | Out-Null
          if (-not (Test-Path target/release/goalport-core.exe)) {
            Set-Content -Path target/release/goalport-core.exe -Value ''
          }
          if (-not (Test-Path target/release/goalport-core-launcher.exe)) {
            Set-Content -Path target/release/goalport-core-launcher.exe -Value ''
          }
      - run: cargo test -p goalport-desktop

  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-12); toolchain pinned via `with:` below
        with:
          toolchain: 1.96.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:desktop
      - name: Fetch locked Rust dependencies for release checks
        run: cargo fetch --locked --target x86_64-pc-windows-msvc
      - run: pnpm test:release
      - run: pnpm electron:package --out artifacts/electron-rc/ci
      - run: pnpm electron:verify --package artifacts/electron-rc/ci/GoalPort-win32-x64
      - name: Packaged normal first use
        run: node scripts/desktop/smoke.mjs --package artifacts/electron-rc/ci/GoalPort-win32-x64 --normal --out artifacts/electron-rc/ci-normal-smoke
      - name: Packaged synthetic consecutive tasks
        run: node scripts/desktop/smoke.mjs --package artifacts/electron-rc/ci/GoalPort-win32-x64 --out artifacts/electron-rc/ci-synthetic-smoke
      - name: Early smoke failure cleans its owned Core
        run: node scripts/desktop/verify-early-cleanup.mjs --package artifacts/electron-rc/ci/GoalPort-win32-x64 --out artifacts/electron-rc/ci-early-cleanup
      - name: Retain redacted smoke failure summaries
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-smoke-failure
          path: |
            artifacts/electron-rc/ci-normal-smoke/failure-summary.json
            artifacts/electron-rc/ci-synthetic-smoke/failure-summary.json
            artifacts/electron-rc/ci-early-cleanup/failure-summary.json
          if-no-files-found: ignore
          retention-days: 7
