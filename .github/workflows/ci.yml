# Windows code contracts and repository-built Electron RC smoke.
# Synthetic Desktop checks do not establish native subscription admission.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:unit
      - run: node --test scripts/runtime-live-safety.test.mjs scripts/scenario-predicate-gate.test.mjs scripts/connected/strict-predicates.test.mjs scripts/connected/ipc-client.test.mjs

  core:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-12); toolchain pinned via `with:` below
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Core contract tests
        shell: pwsh
        run: |
          Get-ChildItem Env: |
            Where-Object { $_.Name -like 'GOALPORT_*' } |
            ForEach-Object { Remove-Item "Env:$($_.Name)" }
          cargo test -p goalport-core --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p goalport-core --test workspace_aliases --test workspace_identity --test electron_rc_core --test handoff_lineage --test product_receipts --test scenario_turn_failure --test selection_preservation --test registration_boundary --test core_contract --test connected_projection --test connected_flow --test scenario_predicates --test state_machine --test hardening --test recovery --test stop_responsibility --test stop_continuation --test pipe_security --test core_restart_epoch --test product_interaction --test review_debt_core --test conversation_paging --test profile_ops_recovery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p goalport-core --test registration_generation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p goalport-core-launcher -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Placeholder Core binaries for Tauri resource check
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/release | Out-Null
          if (-not (Test-Path target/release/goalport-core.exe)) {
            Set-Content -Path target/release/goalport-core.exe -Value ''
          }
          if (-not (Test-Path target/release/goalport-core-launcher.exe)) {
            Set-Content -Path target/release/goalport-core-launcher.exe -Value ''
          }
      - run: cargo test -p goalport-desktop

  # Linux Core/Unix-socket slice only. Scenario/dev socket checks are not
  # native Runtime acceptance and do not expand the Windows product platform.
  # Placed before desktop so desktopJob() contract tests still see desktop as
  # the final job whose last step ends at retention-days: 7.
  linux-unix-socket:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-12); toolchain pinned via `with:` below
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Linux Core library tests
        run: cargo test --locked -p goalport-core --lib
      - name: Focused Linux Unix socket tests
        run: cargo test --locked -p goalport-core --test linux_socket -- --nocapture
      - name: Build goalport-core
        run: cargo build --locked -p goalport-core
      - name: Black-box serve + UnixStream client round-trip
        run: |
          set -euo pipefail
          ROOT="$PWD"
          WORK="$(mktemp -d)"
          cleanup() { kill "$CORE_PID" 2>/dev/null || true; rm -rf "$WORK"; }
          trap cleanup EXIT
          export HOME="$WORK"
          PIPE="ci-linux-sock-$$"
          DB="$WORK/core.sqlite"
          SOCK="$(python3 "$ROOT/scripts/connected/unix-client.py" --resolve-only "$PIPE")"
          NONCE="ci-linux-$(date +%s%N)"
          env -u GOALPORT_SOCK \
            GOALPORT_REQUIRE_ISOLATED=1 \
            GOALPORT_LAUNCH_NONCE="$NONCE" \
            GOALPORT_RUN_SLUG=goalport-linux-ci \
            GOALPORT_ELECTRON_PID=1 \
            GOALPORT_ELECTRON_CREATED_MS=1 \
            GOALPORT_ELECTRON_EXE=linux-ci \
            GOALPORT_ELECTRON_SHA256=test-only \
            GOALPORT_LAUNCHER_PID=1 \
            GOALPORT_LAUNCHER_CREATED_MS=1 \
            GOALPORT_LAUNCHER_EXE=linux-ci \
            GOALPORT_LAUNCHER_SHA256=test-only \
            GOALPORT_LAUNCHER_PARENT_PID=1 \
            GOALPORT_LAUNCH_REQUESTED_AT=2026-09-29T00:00:00.000Z \
            GOALPORT_LAUNCHER_STARTED_AT=2026-09-29T00:00:00.001Z \
            GOALPORT_CORE_SPAWNED_AT=2026-09-29T00:00:00.002Z \
            "$ROOT/target/debug/goalport-core" serve --pipe "$PIPE" --db "$DB" &
          CORE_PID=$!
          READY="${DB}.launch-ready"
          for _ in $(seq 1 150); do
            if [ -f "$READY" ] && grep -q READY_COMMITTED "$READY" && grep -q "$NONCE" "$READY"; then
              break
            fi
            if ! kill -0 "$CORE_PID" 2>/dev/null; then
              echo "Core exited before launch-ready" >&2
              exit 1
            fi
            sleep 0.1
          done
          test -S "$SOCK"
          python3 "$ROOT/scripts/connected/unix-client.py" "$PIPE" | tee "$WORK/response.json"
          grep -q '"ok": *true\|"ok":true' "$WORK/response.json"
          PIPE_ID="$(python3 -c "import json; print(json.load(open('$READY'))['pipeIdentity'])")"
          test "$PIPE_ID" = "$SOCK"

  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-12); toolchain pinned via `with:` below
        with:
          toolchain: 1.96.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:desktop
      - name: Electron trust boundary with real WebContents
        run: node scripts/desktop/security-live.mjs --out artifacts/electron-rc/ci-security-live
      - name: Fetch locked Rust dependencies for release checks
        run: cargo fetch --locked --target x86_64-pc-windows-msvc
      - run: pnpm test:release
      - run: pnpm electron:package --out artifacts/electron-rc/ci
      - run: pnpm electron:verify --package artifacts/electron-rc/ci/GoalPort-win32-x64
      - name: Packaged normal first use
        run: node scripts/desktop/smoke.mjs --package artifacts/electron-rc/ci/GoalPort-win32-x64 --normal --out artifacts/electron-rc/ci-normal-smoke
      - name: Packaged synthetic consecutive tasks
        run: node scripts/desktop/smoke.mjs --package artifacts/electron-rc/ci/GoalPort-win32-x64 --out artifacts/electron-rc/ci-synthetic-smoke
      - name: Early smoke failure cleans its owned Core
        run: node scripts/desktop/verify-early-cleanup.mjs --package artifacts/electron-rc/ci/GoalPort-win32-x64 --out artifacts/electron-rc/ci-early-cleanup
      - name: Retain redacted smoke failure summaries
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-smoke-failure
          path: |
            artifacts/electron-rc/ci-normal-smoke/failure-summary.json
            artifacts/electron-rc/ci-synthetic-smoke/failure-summary.json
            artifacts/electron-rc/ci-early-cleanup/failure-summary.json
          if-no-files-found: ignore
          retention-days: 7
